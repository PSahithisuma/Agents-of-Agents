

x-db-env: &db-env
  DATABASE_URL: postgresql+asyncpg://vibeforge:${POSTGRES_PASSWORD}@postgres:5432/vibeforge
  DATABASE_URL_SYNC: postgresql://vibeforge:${POSTGRES_PASSWORD}@postgres:5432/vibeforge

x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
x-llm-env: &llm-env
  LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
  LITELLM_BASE_URL: http://litellm:4000
  GEMINI_API_KEY: ${GEMINI_API_KEY}
  GROQ_API_KEY: ${GROQ_API_KEY}
  GITEA_TOKEN: ${GITEA_TOKEN}

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vibeforge
      POSTGRES_USER: vibeforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibeforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [vibeforge]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [vibeforge]

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [vibeforge]

  # ── LLM Proxy ───────────────────────────────────────────────────────────────

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      DATABASE_URL: postgresql://vibeforge:${POSTGRES_PASSWORD}@postgres:5432/vibeforge
      STORE_MODEL_IN_DB: "True"
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [vibeforge]

  # ── Core Application Services ───────────────────────────────────────────────

  api:
    build:
      context: services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8080"
    environment:
      <<: [*db-env, *redis-env, *llm-env]
      PORT: "8080"
      API_ENV: production
      PUBLIC_BASE_URL: https://agents-of-agents.duckdns.org
      CAPACITY_URL: http://capacity:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [vibeforge]

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*db-env, *redis-env, *llm-env]
      CAPACITY_URL: http://capacity:8080
      QDRANT_URL: http://qdrant:6333
      ARTIFACTS_BUCKET: /artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - artifacts:/artifacts
    networks: [vibeforge]

  delivery:
    build:
      context: services/delivery
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8080"
    environment:
      <<: *db-env
      PORT: "8080"
      GCS_BUCKET: ""
      ARTIFACTS_DIR: /artifacts
    volumes:
      - artifacts:/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    networks: [vibeforge]

  capacity:
    build:
      context: services/capacity
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8080"
    environment:
      <<: [*db-env, *redis-env]
      DATABASE_URL: postgresql://vibeforge:${POSTGRES_PASSWORD}@postgres:5432/vibeforge
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [vibeforge]

  sandbox:
    build:
      context: .
      dockerfile: services/sandbox/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8080"
    environment:
      PORT: "8080"
      DOCKER_HOST: tcp://dockerproxy:2375
      GITEA_URL: http://gitea:3000
      GITEA_TOKEN: ${GITEA_TOKEN}
      GITEA_OWNER: vibeforge-admin
      PUBLIC_BASE_URL: https://agents-of-agents.duckdns.org
      SANDBOX_TTL_SECONDS: "1800"
      SANDBOX_MAX_PREVIEWS: "2"
    depends_on:
      - dockerproxy
    volumes:
      - sandbox_data:/data
    networks: [vibeforge]

  dockerproxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      BUILD: "1"
      POST: "1"
      EXEC: "0"
      VOLUMES: "0"
      SERVICES: "0"
      SWARM: "0"
      SECRETS: "0"
      INFO: "0"
      AUTH: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [vibeforge]

  minio:
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks: [vibeforge]

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8004:8080"
    environment:
      <<: *redis-env
      PORT: "8080"
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks: [vibeforge]

  retrieval:
    build:
      context: .
      dockerfile: services/retrieval/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8005:8080"
    environment:
      <<: *redis-env
      PORT: "8080"
      QDRANT_URL: http://qdrant:6333
    depends_on:
      redis:
        condition: service_healthy
    networks: [vibeforge]

  # ── UI ───────────────────────────────────────────────────────────────────────

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      API_BASE_URL: http://api:8080
      CAPACITY_URL: http://capacity:8080
      KEYCLOAK_URL: http://keycloak:8080
      LITELLM_BASE_URL: http://litellm:4000
    depends_on:
      - api
    networks: [vibeforge]

  # ── Auth ─────────────────────────────────────────────────────────────────────

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: vibeforge
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME: "https://agents-of-agents.duckdns.org"
      KC_HOSTNAME_ADMIN: "http://localhost:8080"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    networks: [vibeforge]

  # ── Observability ────────────────────────────────────────────────────────────

  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://vibeforge:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: http://144.24.149.226:3000
      SALT: vibeforge-salt-2026
      TELEMETRY_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [vibeforge]

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [vibeforge]

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks: [vibeforge]

  # ── Dev Tools ────────────────────────────────────────────────────────────────

  gitea:
    image: gitea/gitea:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: vibeforge
      GITEA__database__PASSWD: ${POSTGRES_PASSWORD}
      GITEA__server__ROOT_URL: https://agents-of-agents.duckdns.org/gitea/
      GITEA__server__DOMAIN: agents-of-agents.duckdns.org
    volumes:
      - gitea_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks: [vibeforge]

  verdaccio:
    image: verdaccio/verdaccio:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:4873:4873"
    volumes:
      - verdaccio_data:/verdaccio/storage
    networks: [vibeforge]

  devpi:
    image: muccg/devpi:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3141:3141"
    volumes:
      - devpi_data:/data
    networks: [vibeforge]

networks:
  vibeforge:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
  gitea_data:
  verdaccio_data:
  devpi_data:
  artifacts:
  sandbox_data:
  minio_data:
