# VibeForge QA Gate — Java Spring Boot Stack
substitutions:
  _JOB_ID:    "unknown"
  _TENANT_ID: "unknown"
  _BUCKET:    "vibeforge-artifacts-dev"
  _STACK:     "java_springboot"

steps:
  - name: gcr.io/cloud-builders/gsutil
    id: extract-source
    args: [cp, "gs://${_BUCKET}/artifacts/${_JOB_ID}/source.tar.gz", /workspace/source.tar.gz]

  - name: ubuntu
    id: unpack-source
    waitFor: [extract-source]
    args: [tar, -xzf, /workspace/source.tar.gz, -C, /workspace/src]
    volumes: [{name: src, path: /workspace/src}]

  # 2. Maven compile + test with coverage (JaCoCo)
  - name: eclipse-temurin:21-jdk
    id: build-and-test
    waitFor: [unpack-source]
    entrypoint: bash
    args:
      - -c
      - |
        cd /workspace/src
        mvn -q -f pom.xml clean verify -Dmaven.test.failure.ignore=true 2>&1 | tail -50
        echo $? > /workspace/maven_exit.txt
        # Extract JaCoCo coverage
        python3 -c "
        import xml.etree.ElementTree as ET, json, os
        try:
            tree = ET.parse('target/site/jacoco/jacoco.xml')
            root = tree.getroot()
            counters = {c.get('type'): c for c in root.findall('.//counter[@type]')}
            inst = counters.get('INSTRUCTION', {})
            covered = int(inst.get('covered', 0))
            missed  = int(inst.get('missed', 0))
            pct = 100.0 * covered / max(1, covered + missed)
        except Exception as e:
            pct = 0.0
        with open('/workspace/coverage.json', 'w') as f:
            json.dump({'percent_covered': pct}, f)
        print(f'Coverage: {pct:.1f}%')
        " || echo '{"percent_covered": 0}' > /workspace/coverage.json
    volumes: [{name: src, path: /workspace/src}]

  # 3. Semgrep
  - name: returntocorp/semgrep
    id: semgrep
    waitFor: [unpack-source]
    entrypoint: semgrep
    args: [--config=auto, --json, "--output=/workspace/semgrep.json", /workspace/src, --no-rewrite-rule-ids]
    volumes: [{name: src, path: /workspace/src}]

  # 4. Trivy
  - name: aquasec/trivy:latest
    id: trivy
    waitFor: [unpack-source]
    args: [fs, --format=json, "--output=/workspace/trivy.json", --severity=HIGH,CRITICAL, /workspace/src]
    volumes: [{name: src, path: /workspace/src}]

  # 5. gitleaks
  - name: zricethezav/gitleaks:latest
    id: gitleaks
    waitFor: [unpack-source]
    args: [detect, "--source=/workspace/src", --report-format=json, "--report-path=/workspace/gitleaks.json", --exit-code=0]
    volumes: [{name: src, path: /workspace/src}]

  # 6. Gate report
  - name: python:3.12-slim
    id: gate-report
    waitFor: [build-and-test, semgrep, trivy, gitleaks]
    entrypoint: bash
    args:
      - -c
      - |
        pip install -q google-cloud-storage
        python3 - <<'PYEOF'
        import json, os, datetime
        from google.cloud import storage

        def load_json(path):
            try:
                with open(path) as f: return json.load(f)
            except Exception: return {}

        coverage  = load_json("/workspace/coverage.json")
        semgrep   = load_json("/workspace/semgrep.json")
        trivy_r   = load_json("/workspace/trivy.json")
        gitleaks  = load_json("/workspace/gitleaks.json")
        maven_exit = int(open("/workspace/maven_exit.txt").read().strip() or "0")
        cov_pct = float(coverage.get("percent_covered", 0))
        semgrep_high = [f for f in semgrep.get("results", []) if f.get("extra", {}).get("severity", "") in ("ERROR","WARNING")]
        trivy_vulns  = trivy_r.get("Results", [{}])[0].get("Vulnerabilities", []) if isinstance(trivy_r.get("Results"), list) else []
        trivy_crit   = [v for v in trivy_vulns if v.get("Severity") in ("CRITICAL","HIGH")]
        secrets      = gitleaks if isinstance(gitleaks, list) else []

        steps = [
            {"name": "compile", "passed": maven_exit == 0,           "detail": {}},
            {"name": "test",    "passed": cov_pct >= 60,             "detail": {"coverage_pct": cov_pct}},
            {"name": "semgrep", "passed": len(semgrep_high) == 0,    "detail": {"findings": len(semgrep_high)}},
            {"name": "trivy",   "passed": len(trivy_crit) == 0,      "detail": {"critical_vulns": len(trivy_crit)}},
            {"name": "gitleaks","passed": len(secrets) == 0,         "detail": {"secrets_found": len(secrets)}},
        ]
        overall = "pass" if all(s["passed"] for s in steps) else "fail"
        report = {"job_id": os.environ["_JOB_ID"], "tenant_id": os.environ["_TENANT_ID"],
                  "stack": "java_springboot", "overall": overall, "steps": steps,
                  "coverage_pct": cov_pct, "created_at": datetime.datetime.utcnow().isoformat()+"Z"}
        client = storage.Client()
        bucket = client.bucket(os.environ["_BUCKET"])
        blob = bucket.blob(f"gate-runs/{os.environ['_JOB_ID']}/gate_report.json")
        blob.upload_from_string(json.dumps(report, indent=2), content_type="application/json")
        print(f"GateReport: overall={overall}, coverage={cov_pct:.1f}%")
        PYEOF

options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s