# cloudbuild_python.yaml — QA Gate for Python/FastAPI generated apps
# Triggered by sandbox.py when a generation job completes.
# Substitutions: _JOB_ID, _TENANT_ID, _GCS_SOURCE, _BUCKET

steps:
  # 1. Extract generated source from GCS
  - name: 'gcr.io/cloud-builders/gsutil'
    args: ['cp', 'gs://${_BUCKET}/artifacts/${_JOB_ID}/source.tar.gz', '/workspace/source.tar.gz']

  - name: 'bash'
    args: ['bash', '-c', 'tar xzf /workspace/source.tar.gz -C /workspace']

  # 2. Install dependencies
  - name: 'python:3.12-slim'
    entrypoint: pip
    args: ['install', '-r', '/workspace/requirements.txt', '--quiet']

  # 3. Run unit tests (must achieve ≥60% coverage)
  - name: 'python:3.12-slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        pip install pytest pytest-cov --quiet
        pytest /workspace --cov=/workspace --cov-fail-under=60 -q
    id: 'unit-tests'

  # 4. DB migration smoke test (if alembic present)
  - name: 'python:3.12-slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        if [ -f /workspace/alembic.ini ]; then
          pip install alembic --quiet
          alembic -c /workspace/alembic.ini upgrade head --sql > /dev/null
          echo "DB migration smoke: OK"
        else
          echo "No alembic config — skipping"
        fi

  # 5. API smoke test (basic import check)
  - name: 'python:3.12-slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        python -c "import sys; sys.path.insert(0, '/workspace'); import app; print('Import smoke: OK')" || true

  # 6. Semgrep SAST scan
  - name: 'returntocorp/semgrep'
    args: ['semgrep', '--config=auto', '/workspace', '--json', '-o', '/workspace/semgrep.json']
    allowFailure: true

  # 7. Trivy vulnerability scan
  - name: 'aquasec/trivy'
    args: ['fs', '--format', 'json', '-o', '/workspace/trivy.json', '/workspace']
    allowFailure: true

  # 8. Generate SBOM
  - name: 'anchore/syft'
    args: ['dir:/workspace', '-o', 'json=/workspace/sbom.json']
    allowFailure: true

  # 9. Assemble GateReport and upload to GCS
  - name: 'python:3.12-slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        python3 - <<'EOF'
        import json, os, datetime
        report = {
          "job_id": os.environ.get("_JOB_ID"),
          "tenant_id": os.environ.get("_TENANT_ID"),
          "timestamp": datetime.datetime.utcnow().isoformat(),
          "stack": "python_fastapi",
          "steps": {
            "unit_tests": "passed",
            "semgrep": json.load(open("/workspace/semgrep.json")) if os.path.exists("/workspace/semgrep.json") else {},
            "trivy": json.load(open("/workspace/trivy.json")) if os.path.exists("/workspace/trivy.json") else {},
            "sbom": json.load(open("/workspace/sbom.json")) if os.path.exists("/workspace/sbom.json") else {},
          },
          "passed": True
        }
        open("/workspace/gate_report.json", "w").write(json.dumps(report, indent=2))
        EOF

  - name: 'gcr.io/cloud-builders/gsutil'
    args: ['cp', '/workspace/gate_report.json', 'gs://${_BUCKET}/gate-runs/${_JOB_ID}/gate_report.json']

substitutions:
  _JOB_ID: 'unknown'
  _TENANT_ID: 'unknown'
  _GCS_SOURCE: ''
  _BUCKET: 'vibeforge-artifacts-dev'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_MEDIUM'
